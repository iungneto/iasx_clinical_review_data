# IASX Clinical Review — stack de dados (Databricks Free Edition + Lakeflow Declarative Pipelines)
bundle:
  name: iasx_clinical_review_data

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo Unity Catalog (na Free Edition o catálogo padrão é "workspace").
    default: workspace
  schema:
    description: Schema onde a pipeline publica bronze/silver/gold.
    default: iasx_clinical
  workflow_version:
    description: Versão do workflow IASX (vai on-chain como metadado técnico).
    default: "iasx-wf-1.0.0"
  secret_scope:
    description: Secret scope com a chave da API do Jev (nunca no repositório).
    default: iasx
  warehouse_id:
    description: SQL Warehouse usado pela API do JEV (leitura da gold).
    lookup:
      warehouse: Serverless Starter Warehouse
  jev_client_id:
    description: applicationId do service principal jev-frontend (o JEV chama a API com ele; o secret fica só no JEV).
    default: 85411c37-d717-4c8f-9d14-f632e63b9a41
  solana_rpc_url:
    description: Endpoint RPC da Solana usado na verificação. O MVP aceita somente Devnet (verify_onchain recusa outro cluster).
    default: https://api.devnet.solana.com
  solana_program_id:
    description: Program ID do programa de atestação na Devnet (preencher após o deploy do programa).
    default: "REPLACE_WITH_PROGRAM_ID"

targets:
  dev:
    mode: development
    default: true
    workspace:
      # URL do workspace Free Edition, ex.: https://dbc-xxxxxxxx-xxxx.cloud.databricks.com
      host: https://dbc-c45b5519-fb4f.cloud.databricks.com