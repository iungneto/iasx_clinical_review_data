# IASX Clinical Review — stack de dados (Databricks Free Edition + Lakeflow Declarative Pipelines)
bundle:
  name: iasx_clinical_review_data

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo Unity Catalog (na Free Edition o catálogo padrão é "workspace").
    default: workspace
  schema:
    description: Schema onde a pipeline publica bronze/silver/gold.
    default: iasx_clinical
  workflow_version:
    description: Versão do workflow IASX (vai on-chain como metadado técnico).
    default: "iasx-wf-1.0.0"
  secret_scope:
    description: Secret scope com a chave da API do Jev (nunca no repositório).
    default: iasx
  app_name:
    description: Nome do Databricks App da API do JEV (o modo development não prefixa apps, então cada target usa o seu).
    default: iasx-jev-api
  warehouse_id:
    description: SQL Warehouse usado pela API do JEV (leitura da gold).
    lookup:
      warehouse: Serverless Starter Warehouse
  jev_client_id:
    description: applicationId do service principal jev-frontend (o JEV chama a API com ele; o secret fica só no JEV).
    default: 85411c37-d717-4c8f-9d14-f632e63b9a41
  solana_rpc_url:
    description: Endpoint RPC da Solana usado na verificação. O MVP aceita somente Devnet (verify_onchain recusa outro cluster).
    default: https://api.devnet.solana.com
  solana_program_id:
    description: Program ID do programa de atestação na Devnet (preencher após o deploy do programa).
    default: "REPLACE_WITH_PROGRAM_ID"
  solana_mode:
    description: >-
      devnet = envio e verificação reais na Devnet; emulated = a API emula o envio (sem transação) e a revisão
      vira ATTESTED_EMULATED, nunca ATTESTED. Use emulated só enquanto o programa de atestação não está publicado.
    default: devnet

targets:
  dev:
    mode: development
    default: true
    presets:
      # Deploy pela Git folder do workspace (botão Deploy) também copia os arquivos para .bundle/, como o CLI.
      # Assim, pull ou troca de branch na Git folder só chega à pipeline e aos jobs no próximo deploy.
      source_linked_deployment: false
    variables:
      # Sem Program ID ainda: o dev usa o emulador da Solana. Volte para devnet ao publicar o programa.
      solana_mode: emulated
    workspace:
      # URL do workspace Free Edition, ex.: https://dbc-xxxxxxxx-xxxx.cloud.databricks.com
      host: https://dbc-c45b5519-fb4f.cloud.databricks.com

  # Produção: deploy só a partir da branch main, com schema sem prefixo (workspace.iasx_clinical) e app próprio.
  #   git checkout main && databricks bundle deploy -t prd --profile <perfil>
  prd:
    mode: production
    git:
      branch: main
    workspace:
      host: https://dbc-c45b5519-fb4f.cloud.databricks.com
      root_path: /Workspace/Users/iungneto@gmail.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: iungneto@gmail.com
    variables:
      app_name: iasx-jev-api-prd
