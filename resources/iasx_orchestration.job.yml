resources:
  jobs:
    # Tarefas de notebook rodam em compute serverless (padrão da Free Edition quando nenhum cluster é informado).
    # Prepara as pastas do volume, carrega os casos sintéticos A–D e aplica as políticas de mascaramento
    # (column masks) que as tabelas da pipeline referenciam. Rode antes do primeiro iasx_review_cycle.
    iasx_bootstrap:
      name: iasx_bootstrap
      tasks:
        - task_key: bootstrap_landing
          notebook_task:
            notebook_path: ../src/jobs/00_bootstrap_landing.py
            base_parameters:
              landing_root: /Volumes/${var.catalog}/${resources.schemas.iasx_schema.name}/${resources.volumes.landing.name}

        - task_key: apply_access_policies
          notebook_task:
            notebook_path: ../src/jobs/apply_access_policies.py
            base_parameters:
              fq_schema: ${var.catalog}.${resources.schemas.iasx_schema.name}

    # Ciclo completo da revisão:
    #   pipeline (extração/achados) → Jev (decisões estruturadas) → verificação on-chain → pipeline (estado final)
    # mode=decisions_only (signoff do profissional): só chegaram decisões, então pula a extração e o Jev
    # e vai direto à verificação on-chain e ao estado final (economiza uma subida da pipeline).
    iasx_review_cycle:
      name: iasx_review_cycle
      max_concurrent_runs: 1
      parameters:
        - name: mode
          default: full
      tasks:
        - task_key: needs_extraction
          condition_task:
            op: NOT_EQUAL
            left: "{{job.parameters.mode}}"
            right: decisions_only

        - task_key: extract_and_find
          depends_on:
            - task_key: needs_extraction
              outcome: "true"
          pipeline_task:
            pipeline_id: ${resources.pipelines.iasx_clinical_pipeline.id}

        - task_key: jev_classify
          depends_on:
            - task_key: extract_and_find
          notebook_task:
            notebook_path: ../src/jobs/jev_classify.py
            base_parameters:
              landing_root: /Volumes/${var.catalog}/${resources.schemas.iasx_schema.name}/${resources.volumes.landing.name}
              fq_schema: ${var.catalog}.${resources.schemas.iasx_schema.name}
              secret_scope: ${var.secret_scope}
              workflow_version: ${var.workflow_version}
              # "mock" permite ensaiar a demo sem chave; use "live" com a chave no secret scope.
              jev_mode: mock

        - task_key: verify_onchain
          # Um dos dois caminhos: Jev concluído (full) ou condição falsa (decisions_only, extração e Jev excluídos).
          # Se o Jev falhar no modo full, nenhum dos dois tem sucesso e o ciclo para aqui.
          depends_on:
            - task_key: needs_extraction
              outcome: "false"
            - task_key: jev_classify
          run_if: AT_LEAST_ONE_SUCCESS
          notebook_task:
            notebook_path: ../src/jobs/verify_onchain.py
            base_parameters:
              landing_root: /Volumes/${var.catalog}/${resources.schemas.iasx_schema.name}/${resources.volumes.landing.name}
              fq_schema: ${var.catalog}.${resources.schemas.iasx_schema.name}
              solana_rpc_url: ${var.solana_rpc_url}
              solana_program_id: ${var.solana_program_id}
              solana_mode: ${var.solana_mode}

        - task_key: refresh_review_state
          depends_on:
            - task_key: verify_onchain
          pipeline_task:
            pipeline_id: ${resources.pipelines.iasx_clinical_pipeline.id}
            # Só o que muda depois do Jev, das decisões e da verificação on-chain; documentos, resultados
            # e achados já foram atualizados no extract_and_find.
            refresh_selection:
              - bronze_jev_decisions
              - silver_jev_decisions
              - bronze_review_decisions
              - silver_review_decisions
              - bronze_attestations
              - silver_attestations
              - bronze_attestation_verifications
              - silver_attestation_verifications
              - gold_review_queue
              - gold_attestation_payload
              - gold_review_status
              - gold_mvp_metrics

